<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#050303;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:16px;}
  .wrap{max-width:460px;margin:0 auto;}
  .box{background:#0d0808;border:1px solid rgba(255,31,61,.3);border-radius:14px;padding:16px;margin-bottom:12px;}
  h1{font-size:1.15rem;color:#ff3b52;text-align:center;margin-bottom:12px;}
  label{display:block;font-size:.78rem;color:#c9b9b9;margin:8px 0 3px;}
  input[type=text],input[type=email],input[type=password]{width:100%;padding:9px;border-radius:8px;border:1px solid #3a1a1a;background:#160c0c;color:#fff;font-size:.92rem;}
  button{padding:9px 12px;border:0;border-radius:8px;background:linear-gradient(135deg,#ff2d47,#c2091f);color:#fff;font-weight:600;font-size:.82rem;cursor:pointer;}
  button.full{width:100%;margin-top:12px;padding:11px;font-size:.95rem;}
  button.alt{background:transparent;border:1px solid rgba(255,31,61,.5);}
  button.del{background:#5a0f18;}
  button:disabled{opacity:.6;}
  .msg{margin-top:8px;font-size:.8rem;text-align:center;min-height:1em;}
  .err{color:#ff6b6b;} .ok{color:#6bff95;}
  .hide{display:none;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;}
  .top span{font-size:.8rem;color:#c9b9b9;}
  .row{display:flex;gap:10px;align-items:center;}
  .row img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid #ff1f3d;background:#1a1010;flex-shrink:0;}
  .info{min-width:0;flex:1;}
  .info b{display:block;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .info small{display:block;color:#a99898;font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .edit{margin-top:10px;border-top:1px dashed #3a1a1a;padding-top:6px;}
  .edit img.pv{width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid #ff1f3d;display:block;margin:6px 0;}
  .count{text-align:center;color:#c9b9b9;font-size:.8rem;margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="box" id="loginView">
    <h1>Admin Login</h1>
    <label>Email</label><input type="email" id="email">
    <label>Password</label><input type="password" id="pass">
    <button class="full" id="loginBtn">Login</button>
    <div class="msg err" id="loginMsg"></div>
  </div>

  <div class="hide" id="adminView">
    <div class="top"><h1 style="margin:0;text-align:left">Admin Panel</h1><button class="alt" id="logoutBtn">Logout</button></div>
    <div class="count" id="count"></div>
    <div class="msg" id="topMsg"></div>
    <div id="list"></div>
  </div>

</div>

<script type="module">
import { auth, db, ADMIN_EMAIL } from "./firebase-config.js";
import { signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, getDocs, doc, updateDoc, deleteDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = (id) => document.getElementById(id);
const pageUrl = (id) => new URL("p.html?id=" + id, location.href).href;

$("loginBtn").onclick = async () => {
  $("loginMsg").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch (e) { $("loginMsg").textContent = "Email ya password galat hai."; }
};
$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  if (!user) { $("loginView").classList.remove("hide"); $("adminView").classList.add("hide"); return; }
  if ((user.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
    // signOut NAHI karte: auth sab tabs mein shared hota hai, isse normal users logout ho jate the
    $("loginView").classList.remove("hide");
    $("adminView").classList.add("hide");
    $("loginMsg").textContent = "Ye admin account nahi hai. Admin email se login karein.";
    return;
  }
  $("loginView").classList.add("hide");
  $("adminView").classList.remove("hide");
  loadAll();
});

// ---------- helpers ----------
function normChannel(v){
  v = v.trim();
  if (!v) return null;
  if (v.startsWith("@")) return "https://t.me/" + v.slice(1);
  if (/^(t\.me|telegram\.me)\//i.test(v)) v = "https://" + v;
  return /^https:\/\/(t\.me|telegram\.me)\/.+/i.test(v) ? v : null;
}
function normUser(v){
  v = v.trim().replace(/^@+/, "");
  return /^[A-Za-z0-9_]{3,32}$/.test(v) ? v : null;
}
function compress(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const S = 300, c = document.createElement("canvas");
      c.width = c.height = S;
      const m = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
      res(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => rej(new Error("Photo load nahi hui"));
    img.src = URL.createObjectURL(file);
  });
}
function el(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  Object.assign(e, props);
  kids.forEach((k) => e.append(k));
  return e;
}
function setMsg(node, text, ok){
  node.className = "msg " + (ok ? "ok" : "err");
  node.textContent = text;
}

// ---------- list ----------
async function loadAll(){
  const list = $("list");
  list.innerHTML = "";
  setMsg($("topMsg"), "Loading...", true);
  try {
    const snap = await getDocs(collection(db, "pages"));
    const items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    items.sort((a, b) => (b.updatedAt?.seconds || 0) - (a.updatedAt?.seconds || 0));
    $("count").textContent = "Total pages: " + items.length;
    $("topMsg").textContent = "";
    if (!items.length) list.append(el("div", { className: "box", textContent: "Abhi koi page nahi bana." }));
    items.forEach((it) => list.append(card(it)));
  } catch (e) {
    setMsg($("topMsg"), "Load nahi hua: " + (e.code || e.message) + " (Firestore rules aur ADMIN_EMAIL check karein)", false);
  }
}

function card(it){
  const box = el("div", { className: "box" });
  const img = el("img", { src: it.photo || "", alt: "" });
  const info = el("div", { className: "info" },
    el("b", { textContent: it.name || "-" }),
    el("small", { textContent: "@" + (it.username || "-") }),
    el("small", { textContent: it.channel || "-" }),
    el("small", { textContent: "ID: " + it.id })
  );
  box.append(el("div", { className: "row" }, img, info));

  const msg = el("div", { className: "msg" });
  const copyBtn = el("button", { textContent: "Copy Link" });
  const openBtn = el("button", { className: "alt", textContent: "Open" });
  const editBtn = el("button", { className: "alt", textContent: "Edit" });
  const delBtn  = el("button", { className: "del", textContent: "Delete" });
  box.append(el("div", { className: "btns" }, copyBtn, openBtn, editBtn, delBtn), msg);

  copyBtn.onclick = async () => {
    try { await navigator.clipboard.writeText(pageUrl(it.id)); setMsg(msg, "Link copy ho gaya.", true); }
    catch { setMsg(msg, pageUrl(it.id), true); }
  };
  openBtn.onclick = () => window.open(pageUrl(it.id), "_blank");

  // edit panel
  const panel = el("div", { className: "edit hide" });
  const pv = el("img", { className: "pv", src: it.photo || "", alt: "" });
  const file = el("input", { type: "file", accept: "image/*" });
  const nameI = el("input", { type: "text", value: it.name || "", maxLength: 40 });
  const chI = el("input", { type: "text", value: it.channel || "" });
  const usI = el("input", { type: "text", value: "@" + (it.username || "") });
  const saveBtn = el("button", { className: "full", textContent: "Save Changes" });
  let newPhoto = null;
  panel.append(
    el("label", { textContent: "Photo" }), pv, file,
    el("label", { textContent: "Name" }), nameI,
    el("label", { textContent: "Channel link" }), chI,
    el("label", { textContent: "Username" }), usI,
    saveBtn
  );
  box.append(panel);

  editBtn.onclick = () => panel.classList.toggle("hide");

  file.onchange = async () => {
    if (!file.files[0]) return;
    try { newPhoto = await compress(file.files[0]); pv.src = newPhoto; }
    catch (e) { setMsg(msg, e.message, false); }
  };

  saveBtn.onclick = async () => {
    const name = nameI.value.trim();
    const channel = normChannel(chI.value);
    const username = normUser(usI.value);
    if (!name) return setMsg(msg, "Name likhein.", false);
    if (!channel) return setMsg(msg, "Channel link sahi nahi (https://t.me/...).", false);
    if (!username) return setMsg(msg, "Username sahi nahi.", false);
    saveBtn.disabled = true;
    try {
      const data = { name, channel, username, updatedAt: serverTimestamp() };
      if (newPhoto) data.photo = newPhoto;
      await updateDoc(doc(db, "pages", it.id), data);
      Object.assign(it, { name, channel, username }, newPhoto ? { photo: newPhoto } : {});
      info.children[0].textContent = name;
      info.children[1].textContent = "@" + username;
      info.children[2].textContent = channel;
      if (newPhoto) img.src = newPhoto;
      chI.value = channel; usI.value = "@" + username;
      setMsg(msg, "✅ Save ho gaya.", true);
    } catch (e) { setMsg(msg, "Error: " + (e.code || e.message), false); }
    saveBtn.disabled = false;
  };

  delBtn.onclick = async () => {
    if (!confirm("Ye page delete karna hai? Wapas nahi aayega.")) return;
    try { await deleteDoc(doc(db, "pages", it.id)); box.remove(); }
    catch (e) { setMsg(msg, "Error: " + (e.code || e.message), false); }
  };

  return box;
}
</script>
</body>
</html>
