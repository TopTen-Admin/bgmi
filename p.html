<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Telegram</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#050303;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{width:100%;max-width:320px;background:#0d0808;border:1px solid rgba(255,31,61,.3);border-radius:18px;padding:22px 18px;text-align:center;box-shadow:0 0 40px rgba(255,31,61,.2);}
  .av{width:92px;height:92px;margin:0 auto 12px;border-radius:50%;padding:3px;background:conic-gradient(#ff1f3d,#ff9a3d,#ff1f3d);animation:spin 4s linear infinite;}
  .av-in{width:100%;height:100%;border-radius:50%;background:#0d0808;padding:3px;animation:spin 4s linear infinite reverse;}
  .av-in img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  h1{font-size:1.25rem;margin-bottom:6px;}
  p{font-size:.85rem;color:#c9b9b9;margin-bottom:16px;}
  a.btn{display:block;padding:12px;border-radius:10px;text-decoration:none;font-weight:700;font-size:.95rem;margin-top:10px;}
  a.join{background:linear-gradient(135deg,#ff2d47,#c2091f);color:#fff;box-shadow:0 0 22px rgba(255,31,61,.5);}
  a.msg{background:rgba(255,31,61,.08);border:1px solid rgba(255,31,61,.4);color:#f5eeee;font-weight:600;font-size:.85rem;}
  .nf{color:#c9b9b9;text-align:center;}
</style>
</head>
<body>
<div id="root" class="nf">Loading...</div>
<script type="module">
import { db } from "./firebase-config.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const root = document.getElementById("root");
const id = new URLSearchParams(location.search).get("id");

(async () => {
  try {
    if (!id) throw new Error("no id");
    const snap = await getDoc(doc(db, "pages", id));
    if (!snap.exists()) throw new Error("not found");
    const d = snap.data();

    // security: sirf telegram links aur image data allow
    const okLink = /^https:\/\/(t\.me|telegram\.me)\//i.test(d.channel);
    const okUser = /^[A-Za-z0-9_]{3,32}$/.test(d.username);
    const okImg = typeof d.photo === "string" && d.photo.startsWith("data:image/");
    if (!okLink || !okUser || !okImg) throw new Error("bad data");

    document.title = d.name + " — Join Telegram";
    root.className = "card";
    root.innerHTML = "";

    const av = document.createElement("div"); av.className = "av";
    const avIn = document.createElement("div"); avIn.className = "av-in";
    const img = document.createElement("img"); img.src = d.photo; img.alt = "";
    avIn.appendChild(img); av.appendChild(avIn);

    const h = document.createElement("h1"); h.textContent = d.name;
    const p = document.createElement("p"); p.textContent = "Join my Telegram channel";

    const a1 = document.createElement("a");
    a1.className = "btn join"; a1.href = d.channel; a1.target = "_blank"; a1.rel = "noopener";
    a1.textContent = "Join Telegram Now";

    const a2 = document.createElement("a");
    a2.className = "btn msg"; a2.href = "https://t.me/" + d.username; a2.target = "_blank"; a2.rel = "noopener";
    a2.textContent = "Message the Owner";

    root.append(av, h, p, a1, a2);
  } catch (e) {
    root.textContent = "Page nahi mila.";
  }
})();
</script>
</body>
</html>
